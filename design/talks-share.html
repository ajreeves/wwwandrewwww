<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talks and events sharing card</title>
  <link rel="stylesheet" href="https://use.typekit.net/yjm8eqw.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; height: 630px; background: white; color: #202020; font-family: "ivystyle-sans", Calibri, sans-serif; }
    header { height: 188px; padding: 35px 48px; border-top: 7px solid #ba0c2f; display: flex; align-items: center; justify-content: space-between; gap: 36px; }
    h1 { margin: 0; font-family: "ivypresto-headline", Georgia, serif; font-size: 76px; font-weight: 400; line-height: 1.1; letter-spacing: -0.01em; }
    .identity { padding-left: 30px; border-left: 1px solid #d7d2cb; flex: 0 0 300px; }
    .name { margin: 0 0 8px; font-size: 28px; font-weight: 600; }
    .university { margin: 0; font-size: 20px; line-height: 1.35; color: #555; }
    figure { position: relative; margin: 0; width: 1200px; height: 402px; overflow: hidden; }
    figure img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; }
    figcaption { position: absolute; right: 16px; bottom: 12px; padding: 4px 8px; color: white; background: #202020d9; font-size: 14px; }
    footer { height: 40px; padding: 9px 48px; color: #555; font-size: 17px; }
  </style>
</head>
<body>
  <header>
    <h1>Talks and events</h1>
    <div class="identity"><p class="name">Andrew Reeves</p><p class="university">Washington University<br>in St. Louis</p></div>
  </header>
  <figure><img src="/images/editorial/adriana-kugler-conversation.jpg" alt="Adriana Kugler in conversation with Andrew Reeves"><figcaption>Photo: Jerry Naunheim Jr./WashU</figcaption></figure>
  <footer>andrewreeves.org</footer>
</body>
</html>
