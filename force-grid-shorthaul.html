<!doctype html>
<meta charset="utf-8">
<style>
  html, body, iframe { margin: 0; width: 100%; height: 100%; border: 0; }
</style>
<iframe id="research" src="/_site/research/index.html" title="Research preview"></iframe>
<script>
  const frame = document.getElementById('research');
  frame.addEventListener('load', () => {
    const doc = frame.contentDocument;
    if (!doc) return;
    const gridBtn = doc.querySelector('.research-view-btn[data-view="grid"]');
    if (gridBtn) gridBtn.click();
    window.setTimeout(() => {
      const links = Array.from(doc.querySelectorAll('.listing-title a'));
      const target = links.find((a) => a.textContent.includes('Short-Haul Moves'));
      if (target) {
        target.scrollIntoView({ block: 'center' });
      }
    }, 500);
  });
</script>
