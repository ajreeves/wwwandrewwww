project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - research/index.qmd
    - research/*/index.md
    - teaching/index.qmd
    - news/index.qmd
    - cv/index.qmd
    - contact/index.qmd
    - talks/index.qmd
  resources:
    - papers/
    - images/
    - "*.pdf"
    - "practice-of-citizenship-syllabus-spring-2026.pdf"
    - "research/*/*.png"
    - "research/*/*.jpg"
    - "research/*/*.jpeg"

website:
  title: "Andrew Reeves"
  description: "Political scientist focused on presidential power, policy delivery, and democratic accountability."
  favicon: favicon.png
  google-analytics: "G-73ZBNNCNMP"
  navbar:
    pinned: true
    search: true
    left:
      - href: /
        text: Home
      - href: research/
        text: Research
      - href: teaching/
        text: Teaching
      - href: news/
        text: Media & Writing
      - href: talks/
        text: Talks
      - href: cv/
        text: CV
      - href: contact/
        text: Contact
    right:
      - icon: envelope
        href: mailto:reeves@wustl.edu
        aria-label: Email
      - icon: linkedin
        href: https://www.linkedin.com/in/areeves/
        aria-label: LinkedIn
      - icon: mortarboard-fill
        href: https://scholar.google.com/citations?hl=en&user=xPSRkX4AAAAJ
        aria-label: Google Scholar
  page-footer:
    left: "© 2026 Andrew Reeves"
    right: "Washington University in St. Louis"

format:
  html:
    theme:
      light:
        - litera
        - styles-light.scss
      dark:
        - darkly
        - styles-dark.scss
    css:
      - styles-overrides.css
    toc: false
    page-layout: full
    anchor-sections: false
    smooth-scroll: false
    link-external-newwindow: true
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Public+Sans:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">

bibliography: references.bib
csl: https://raw.githubusercontent.com/citation-style-language/styles/master/american-political-science-association.csl

execute:
  freeze: auto
