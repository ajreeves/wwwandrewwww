project:
  type: website
  output-dir: _site
  post-render:
    - python3 scripts/post_render_a11y.py
  render:
    - index.qmd
    - research/index.qmd
    - research/*/index.md
    - teaching/index.qmd
    - news/index.qmd
    - cv/index.qmd
    - contact/index.qmd
    - talks/index.qmd
  resources:
    - papers/
    - images/
    - food-pantries/**
    - "*.pdf"
    - "practice-of-citizenship-syllabus-spring-2026.pdf"
    - "research/*/*.png"
    - "research/*/*.jpg"
    - "research/*/*.jpeg"

website:
  title: "Andrew Reeves"
  description: "Political scientist focused on presidential power, policy delivery, and democratic accountability."
  favicon: favicon.png
  google-analytics: "G-73ZBNNCNMP"
  navbar:
    pinned: true
    search: true
    left:
      - href: /
        text: Home
      - href: research/
        text: Research
      - href: teaching/
        text: Teaching
      - href: news/
        text: Media & Writing
      - href: talks/
        text: Talks
      - href: cv/
        text: CV
      - href: contact/
        text: Contact
    right:
      - icon: envelope
        href: mailto:reeves@wustl.edu
        aria-label: Email
      - icon: linkedin
        href: https://www.linkedin.com/in/areeves/
        aria-label: LinkedIn
      - icon: mortarboard-fill
        href: https://scholar.google.com/citations?hl=en&user=xPSRkX4AAAAJ
        aria-label: Google Scholar
  page-footer:
    left: "© 2026 Andrew Reeves"
    right: "<a class='footer-washu-lockup' href='https://washu.edu' aria-label='Washington University in St. Louis' title='Washington University in St. Louis'><img class='footer-washu-logo' src='/images/washu-logo/WashU-Reverse_web.png' alt='Washington University in St. Louis logo'></a>"

format:
  html:
    theme:
      light:
        - litera
        - styles-light.scss
      dark:
        - darkly
        - styles-dark.scss
    css:
      - styles-overrides.css
    toc: false
    page-layout: full
    anchor-sections: false
    smooth-scroll: false
    link-external-newwindow: true
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">
    include-after-body:
      - text: |
          <!-- Default Statcounter code for Andrew Reeves (New) -->
          <script type="text/javascript">
          var sc_project=12348960;
          var sc_invisible=1;
          var sc_security="3aa7f28c";
          </script>
          <script type="text/javascript"
          src="https://www.statcounter.com/counter/counter.js"
          async></script>
          <noscript><div class="statcounter"><a title="Web Analytics"
          href="https://statcounter.com/" target="_blank"><img
          class="statcounter"
          src="https://c.statcounter.com/12348960/0/3aa7f28c/1/"
          alt="Web Analytics"
          referrerpolicy="no-referrer-when-downgrade"></a></div></noscript>
          <!-- End of Statcounter Code -->

bibliography: references.bib

execute:
  freeze: auto
