<div class="deck-footer">
  <div class="deck-footer-left">
    <img src="visuals/washu-logo/WashU-RGB_web.png" alt="Washington University in St. Louis">
  </div>
  <span class="deck-footer-right">St. Louis Policy Initiative · Weidenbaum Center</span>
</div>
<script>
(() => {
  function hydrateChartImages() {
    document
      .querySelectorAll(".reveal section.chart-slide img[data-src]")
      .forEach((img) => {
        const src = img.getAttribute("data-src");
        if (src && !img.getAttribute("src")) {
          img.setAttribute("src", src);
        }
      });
  }

  function syncFooterCenter() {
    const footer = document.querySelector(".deck-footer");
    if (!footer) return;

    const present =
      document.querySelector(".reveal .slides section.present:not(.stack)") ||
      document.querySelector(".reveal .slides section.present");

    if (!present) return;

    const rect = present.getBoundingClientRect();
    if (!rect.width) return;

    footer.style.left = `${rect.left + rect.width / 2}px`;

    const slideNum = document.querySelector(".reveal .slide-number");
    if (slideNum) {
      const rightOffset = Math.max(8, window.innerWidth - rect.right + 10);
      slideNum.style.right = `${rightOffset}px`;
    }
  }

  function syncLayout() {
    hydrateChartImages();
    syncFooterCenter();
  }

  window.addEventListener("resize", syncLayout);
  window.addEventListener("load", syncLayout);
  document.addEventListener("DOMContentLoaded", syncLayout);

  if (window.Reveal && typeof window.Reveal.on === "function") {
    window.Reveal.on("ready", syncLayout);
    window.Reveal.on("slidechanged", syncLayout);
  } else {
    setTimeout(syncLayout, 250);
    setTimeout(syncLayout, 900);
  }

  syncLayout();
})();
</script>
